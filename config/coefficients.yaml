# Published elasticities and loan parameters for Laubach-framework tracker
# All coefficients from the literature — NOT re-estimated here.

# bp change in long-term rate per 1 pp change in projected debt/GDP
elasticity:
  preferred: 2.0       # Neveu & Schafer (2024, CBO WP 2024-05)
  low: 1.5             # Furceri, Goncalves & Li (2025, IMF WP 25/142, Table 2 T10)
  high: 3.0            # Plante, Richter & Zubairy (2025, Dallas Fed WP 2513)

# ~75% of the fiscal effect flows through the term premium (Plante et al.)
term_premium_share: 0.75

# Pass-through from 10yr Treasury to consumer rates
# Mortgage: ~1:1 with 10yr Treasury (regression beta 1.022, R² 0.89)
# Auto: benchmarked to 5yr Treasury; dampened by shorter duration and
#   nonbank lending share (~55%). Range 0.50-0.75.
# Small business: prime-linked (fed funds + 3%); only the ~25% expected-short-rate
#   channel of the fiscal effect reaches prime.
passthrough:
  mortgage_30yr: 1.0
  auto: 0.50
  small_business: 0.25

# Loan parameters: mortgage from NAR Q3 2026 and PMMS late September 2026,
# auto from Experian Q2 2026, small business from SBA FY2026 7(a) totals and
# prime on Sep 30 2026. `period` is the data period printed in output labels.
# Source strings below are the live reference trail for these assumptions.
loans:
  mortgage:
    label: "Home Mortgage (30 year)"
    period: "Q3 2026"
    principal: 346320     # NAR median single-family home sale price Q3 2026 ($432,900) less 20% down
    term_months: 360
    baseline_rate_pct: 7.03
    source: "NAR median home sale price Q3 2026, Freddie Mac PMMS survey week of Sep 24 2026"
  auto:
    label: "Auto Loan (5¾ year)"
    period: "Q2 2026"
    principal: 43610      # Experian State of Auto Finance Q2 2026 (term 69.46 months)
    term_months: 69
    baseline_rate_pct: 6.35
    source: "Experian 2026 Q2 new car loan data"
  small_business:
    label: "Small Business Loan (10 year)"
    period: "FY2026"
    principal: 577703     # SBA FY2026 7(a) average loan size ($32,426,480,618 / 56,130 loans)
    term_months: 120
    baseline_rate_pct: 10.00
    source: "SBA FY2026 7(a) average loan size (SBA Monthly/Yearly 7(a) and 504 Activity workbook, as of 09/30/2026), FRED DPRIME Sep 30 2026 + 3.00 pp spread assumption"
